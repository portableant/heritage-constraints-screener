<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Heritage Impact & Constraints Screener | Historic England Open Data</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script src="https://unpkg.com/@turf/turf@7.1.0/turf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked@14.1.2/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.2/html2pdf.bundle.min.js"></script>
  <link rel="stylesheet" href="./css/styles.css" />
</head>
<body class="bg-slate-50 text-slate-900 h-screen flex flex-col overflow-hidden">
  <header class="bg-slate-900 text-white px-4 py-2.5 flex flex-wrap items-center justify-between gap-3 border-b border-slate-800 shrink-0">
    <div class="flex items-center gap-2.5">
      <span class="inline-block w-2.5 h-2.5 rounded-full bg-amber-500"></span>
      <h1 class="font-semibold text-sm sm:text-base tracking-tight">Heritage Constraints Screener</h1>
      <span class="hidden md:inline-block text-xs text-slate-400">Historic England Open Data</span>
    </div>

    <div class="flex flex-wrap items-center gap-2 text-xs">
      <form id="search-form" class="flex items-center">
        <input
          id="search-input"
          type="text"
          placeholder="Postcode or place (e.g. HP4 1LJ)"
          class="bg-slate-800 text-white placeholder-slate-400 border border-slate-700 rounded-l px-2.5 py-1.5 w-44 sm:w-56 focus:outline-none focus:border-amber-500"
        />
        <button type="submit" class="bg-amber-600 hover:bg-amber-500 text-white font-medium px-3 py-1.5 rounded-r">
          Search
        </button>
      </form>

      <select id="buffer-select" class="bg-slate-800 text-white border border-slate-700 rounded px-2 py-1.5">
        <option value="250">250 m buffer</option>
        <option value="500" selected>500 m buffer</option>
        <option value="1000">1,000 m buffer</option>
        <option value="2000">2,000 m buffer</option>
      </select>

      <button id="draw-btn" type="button" class="bg-slate-800 hover:bg-slate-700 border border-slate-700 px-2.5 py-1.5 rounded font-medium">
        Draw Polygon
      </button>

      <label class="bg-slate-800 hover:bg-slate-700 border border-slate-700 px-2.5 py-1.5 rounded font-medium cursor-pointer">
        Upload GeoJSON
        <input id="geojson-input" type="file" accept=".geojson,.json" class="hidden" />
      </label>

      <select id="sample-select" class="bg-slate-800 text-white border border-slate-700 rounded px-2 py-1.5">
        <option value="">Sample sites...</option>
        <option value="berkhamsted">Berkhamsted Castle</option>
        <option value="bath">Royal Crescent, Bath</option>
        <option value="stonehenge">Stonehenge Landscape</option>
        <option value="saltaire">Saltaire Model Village</option>
      </select>
    </div>
  </header>

  <div id="app" class="flex-1 flex flex-col lg:flex-row overflow-hidden">
    <main class="relative flex-1 h-1/2 lg:h-full">
      <div id="map" class="w-full h-full"></div>
      <div id="draw-hint" class="hidden absolute top-3 left-3 bg-slate-900/90 text-white text-xs px-3 py-2 rounded shadow-lg">
        Click points on the map to trace a boundary. Double-click to finish.
      </div>
    </main>

    <aside id="results-panel" class="w-full lg:w-[460px] bg-white border-l border-slate-200 flex flex-col h-1/2 lg:h-full overflow-hidden">
      <div id="results-container" class="flex-1 overflow-y-auto p-4 space-y-4">
        <div class="text-sm text-slate-500 bg-slate-50 border border-slate-200 rounded-lg p-4">
          Click anywhere on the map to drop a pin, search a UK postcode, upload a GeoJSON boundary, or click <strong>Draw Polygon</strong> to begin screening.
        </div>
      </div>
    </aside>
  </div>

  <script type="module" src="./js/main.js"></script>
</body>
</html>
